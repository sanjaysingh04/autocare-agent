<!DOCTYPE html>
<html>
<head>
<title><h2>🏥 Patient Recovery Management Login</h2></title>
<style>
body{
    background:#0f172a;
    font-family: Arial;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
    color:white;
}

.card{
    background:#111827;
    padding:40px;
    border-radius:16px;
    width:350px;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    background:#1f2937;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

h2{margin-bottom:20px;}
</style>
</head>

<body>

<div class="card">
<h2>Post Recovery Patient Management System</h2>

<form method="POST">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
</form>

</div>

</body>
</html>
